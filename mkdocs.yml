# Documentation site, published from the repository root (same approach as orion_chemicals_data_platform).
#
#   pip install -r requirements-docs.txt
#   mkdocs serve                  # http://127.0.0.1:8000, live reload
#   mkdocs build --strict         # same checks as a CI gate: broken links fail the build

site_name: Personal Wiki
site_description: Notas de estudo sobre dados, engenharia de dados, Databricks, idiomas e questões de revisão.
docs_dir: .
site_dir: .cache/site
use_directory_urls: true

exclude_docs: |
  .*
  .cache/
  scripts/
  Makefile
  Dockerfile
  docker-compose.yml
  requirements.txt
  pyproject.toml
  poetry.lock
  mkdocs.yml
  wiki_nav.py

plugins:
  - same-dir
  - search

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/notebook-outline
  palette:
    scheme: slate
    primary: blue grey
    accent: light blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/tech.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

validation:
  omitted_files: ignore
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

hooks:
  - wiki_nav.py
