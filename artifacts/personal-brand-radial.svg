<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title description">
  <title id="title">Marca pessoal — diagrama radial</title>
  <desc id="description">Diagrama radial com a elipse central "Pessoal" e seis setas saindo em direção a elementos da marca pessoal: autenticidade, propósito, consistência, conhecimento, história pessoal e valor para os outros.</desc>

  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#17324D" flood-opacity="0.12"/>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17324D" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .guide { fill: none; stroke: #64748B; stroke-width: 3.5; stroke-linecap: round; marker-end: url(#arrow); opacity: 0.8; }
      .sat-title { font-size: 17px; font-weight: 700; letter-spacing: 0.2px; fill: #17324D; }
      .core-title { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="1000" rx="28" fill="#F8FAFC"/>
  <rect x="18" y="18" width="1164" height="964" rx="22" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <g class="font">
    <text x="54" y="64" font-size="25" font-weight="800" letter-spacing="2" fill="#17324D">MARCA PESSOAL</text>
    <text x="54" y="89" font-size="14" font-weight="500" fill="#64748B">elementos que sustentam a percepção que os outros têm de você</text>
  </g>

  <!-- Núcleo central -->
  <g filter="url(#shadow)">
    <ellipse cx="600" cy="500" rx="150" ry="98" fill="#17324D" stroke="#FFFFFF" stroke-width="4"/>
    <ellipse cx="600" cy="500" rx="138" ry="86" fill="none" stroke="#6ED4C1" stroke-width="2" stroke-opacity="0.85"/>
  </g>

  <!-- Setas radiais saindo da borda do núcleo até a borda de cada satélite -->
  <g>
    <line class="guide" x1="555" y1="407" x2="512" y2="318"/>
    <line class="guide" x1="700" y1="427" x2="823" y2="337"/>
    <line class="guide" x1="750" y1="500" x2="891" y2="500"/>
    <line class="guide" x1="700" y1="573" x2="823" y2="663"/>
    <line class="guide" x1="555" y1="593" x2="512" y2="682"/>
    <line class="guide" x1="450" y1="500" x2="309" y2="500"/>
  </g>

  <g class="font">
    <text class="core-title" x="600" y="500" text-anchor="middle" dominant-baseline="central">PESSOAL</text>
  </g>

  <!-- Satélites -->
  <g class="font">

    <!-- topo: autenticidade -->
    <g filter="url(#soft-shadow)">
      <circle cx="462" cy="215" r="98" fill="#FFFFFF" stroke="#F5B4AE" stroke-width="2.5"/>
    </g>
    <text class="sat-title" x="462" y="215" text-anchor="middle" dominant-baseline="central">AUTENTICIDADE</text>

    <!-- topo-direita: propósito -->
    <g filter="url(#soft-shadow)">
      <circle cx="915" cy="270" r="98" fill="#FFFFFF" stroke="#F3D18F" stroke-width="2.5"/>
    </g>
    <text class="sat-title" x="915" y="270" text-anchor="middle" dominant-baseline="central">PROPÓSITO</text>

    <!-- direita: consistência -->
    <g filter="url(#soft-shadow)">
      <circle cx="1005" cy="500" r="98" fill="#FFFFFF" stroke="#8DD5C8" stroke-width="2.5"/>
    </g>
    <text class="sat-title" x="1005" y="500" text-anchor="middle" dominant-baseline="central">CONSISTÊNCIA</text>

    <!-- baixo-direita: conhecimento -->
    <g filter="url(#soft-shadow)">
      <circle cx="915" cy="730" r="98" fill="#FFFFFF" stroke="#AEBDFD" stroke-width="2.5"/>
    </g>
    <text class="sat-title" x="915" y="730" text-anchor="middle" dominant-baseline="central">CONHECIMENTO</text>

    <!-- baixo-esquerda: história pessoal -->
    <g filter="url(#soft-shadow)">
      <circle cx="462" cy="785" r="98" fill="#FFFFFF" stroke="#E6B3D2" stroke-width="2.5"/>
    </g>
    <text class="sat-title" x="462" y="773" text-anchor="middle" dominant-baseline="central">HISTÓRIA</text>
    <text class="sat-title" x="462" y="797" text-anchor="middle" dominant-baseline="central">PESSOAL</text>

    <!-- esquerda: valor para os outros -->
    <g filter="url(#soft-shadow)">
      <circle cx="195" cy="500" r="98" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2.5"/>
    </g>
    <text class="sat-title" x="195" y="488" text-anchor="middle" dominant-baseline="central">VALOR PARA</text>
    <text class="sat-title" x="195" y="512" text-anchor="middle" dominant-baseline="central">OS OUTROS</text>
  </g>
</svg>
