<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1080" viewBox="0 0 1300 1080" role="img" aria-labelledby="title description">
  <title id="title">Quatro arquiteturas de armazenamento de dados, em swim lanes</title>
  <desc id="description">Comparação em quatro raias horizontais. Raia 1, Data Warehouse: dados estruturados fluem por ETL até um Data Warehouse, usado para BI e Analytics. Raia 2, Data Lake: dados brutos são extraídos e carregados num Data Lake, depois transformados para uso final em visualização de dados, data warehouses e machine learning. Raia 3, Two-tier Architecture com Data Lake e Data Warehouse: dados estruturados, semi-estruturados e não estruturados são extraídos e carregados num Data Lake, que alimenta via ETL um Data Warehouse; o Data Lake também alimenta diretamente fontes de dados e machine learning, enquanto o Data Warehouse alimenta BI e relatórios. Raia 4, Datalakehouse Architecture com um Data Lake: dados estruturados, semi-estruturados e não estruturados passam por um processo de ETL antes de entrar num Data Lake que contém uma camada de metadata, catalogação e indexação, alimentando BI, relatórios, fontes de dados e machine learning.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17324D" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0D9488"/>
    </marker>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 2px; fill: #64748B; }
      .h1 { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; fill: #17324D; }
      .lane-label { font-size: 12px; font-weight: 700; letter-spacing: 1.3px; fill: #FFFFFF; }
      .box-title { font-size: 13.5px; font-weight: 750; fill: #17324D; }
      .item { font-size: 11px; font-weight: 500; fill: #475569; }
      .flow { fill: none; stroke: #64748B; stroke-width: 2.25; stroke-linecap: round; marker-end: url(#arrow); }
      .flow-teal { fill: none; stroke: #0D9488; stroke-width: 2.25; stroke-linecap: round; marker-end: url(#arrow-teal); }
      .step-label { font-size: 10.5px; font-weight: 650; letter-spacing: 0.3px; fill: #94A3B8; }
    </style>
  </defs>

  <rect width="1300" height="1080" rx="28" fill="#F8FAFC"/>
  <rect x="18" y="18" width="1264" height="1044" rx="22" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <g class="font">
    <text x="54" y="56" class="eyebrow">ARMAZENAMENTO E GESTÃO DE DADOS</text>
    <text x="54" y="85" class="h1">QUATRO ARQUITETURAS COMPARADAS</text>
  </g>

  <!-- ==================== Lane rails (labels à esquerda) ==================== -->
  <!-- Lane geometry: x 40-1260, 4 lanes of 220px height with 10px gap, starting y=120 -->

  <!-- Lane 1: Data Warehouse -->
  <rect x="40" y="120" width="1220" height="215" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="120" width="34" height="215" rx="16" fill="#6366F1"/>
  <rect x="57" y="120" width="17" height="215" fill="#6366F1"/>
  <text class="font lane-label" x="57" y="230" text-anchor="middle" transform="rotate(-90 57 230)">DATA WAREHOUSE</text>

  <g filter="url(#shadow)">
    <rect x="110" y="165" width="190" height="120" rx="14" fill="#EEF2FF" stroke="#AEBDFD" stroke-width="2"/>
    <rect x="470" y="165" width="210" height="120" rx="14" fill="#FFFFFF" stroke="#AEBDFD" stroke-width="2"/>
    <rect x="850" y="165" width="230" height="120" rx="14" fill="#FFFFFF" stroke="#AEBDFD" stroke-width="2"/>
  </g>
  <g class="font">
    <text class="box-title" x="205" y="200" text-anchor="middle">STRUCTURED DATA</text>
    <text class="item" x="205" y="225" text-anchor="middle">dados relacionais,</text>
    <text class="item" x="205" y="242" text-anchor="middle">já modelados</text>

    <text class="box-title" x="575" y="200" text-anchor="middle">DATA WAREHOUSES</text>
    <text class="item" x="575" y="225" text-anchor="middle">dados limpos, transformados</text>
    <text class="item" x="575" y="242" text-anchor="middle">e estruturados</text>
    <text class="item" x="575" y="259" text-anchor="middle">visão consolidada e unificada</text>

    <text class="box-title" x="965" y="200" text-anchor="middle">BI, ANALYTICS</text>
    <text class="item" x="965" y="225" text-anchor="middle">relatórios e dashboards</text>
    <text class="item" x="965" y="242" text-anchor="middle">tomada de decisão</text>
  </g>
  <path class="flow" d="M 300 225 L 468 225"/>
  <text class="font step-label" x="384" y="212" text-anchor="middle">ETL</text>
  <path class="flow" d="M 680 225 L 848 225"/>

  <!-- Lane 2: Data Lake -->
  <rect x="40" y="345" width="1220" height="215" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="345" width="34" height="215" rx="16" fill="#0D9488"/>
  <rect x="57" y="345" width="17" height="215" fill="#0D9488"/>
  <text class="font lane-label" x="57" y="455" text-anchor="middle" transform="rotate(-90 57 455)">DATA LAKE</text>

  <g filter="url(#shadow)">
    <rect x="110" y="390" width="190" height="120" rx="14" fill="#F0FDFA" stroke="#8DD5C8" stroke-width="2"/>
    <rect x="470" y="390" width="210" height="120" rx="14" fill="#FFFFFF" stroke="#8DD5C8" stroke-width="2"/>
    <rect x="850" y="378" width="230" height="60" rx="12" fill="#FFFFFF" stroke="#8DD5C8" stroke-width="2"/>
    <rect x="850" y="446" width="230" height="60" rx="12" fill="#FFFFFF" stroke="#8DD5C8" stroke-width="2"/>
  </g>
  <g class="font">
    <text class="box-title" x="205" y="425" text-anchor="middle">RAW DATA</text>
    <text class="item" x="205" y="450" text-anchor="middle">qualquer formato,</text>
    <text class="item" x="205" y="467" text-anchor="middle">estado original</text>

    <text class="box-title" x="575" y="425" text-anchor="middle">DATA LAKE</text>
    <text class="item" x="575" y="450" text-anchor="middle">armazenamento bruto,</text>
    <text class="item" x="575" y="467" text-anchor="middle">flexível e econômico</text>
    <text class="item" x="575" y="484" text-anchor="middle">transform depois do load</text>

    <text class="item" x="965" y="402" text-anchor="middle">Data Visualization</text>
    <text class="item" x="965" y="422" text-anchor="middle">Data Warehouses</text>
    <text class="item" x="965" y="470" text-anchor="middle">Machine Learning</text>
  </g>
  <path class="flow-teal" d="M 300 450 L 468 450"/>
  <text class="font step-label" x="384" y="437" text-anchor="middle">EXTRACT / LOAD</text>
  <path class="flow-teal" d="M 680 408 L 848 408"/>
  <path class="flow-teal" d="M 680 476 L 848 476"/>
  <text class="font step-label" x="765" y="395" text-anchor="middle">TRANSFORM · END USE</text>

  <!-- Lane 3: Two-tier Architecture (Data Lake + Data Warehouse) -->
  <rect x="40" y="570" width="1220" height="240" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="570" width="34" height="240" rx="16" fill="#D97706"/>
  <rect x="57" y="570" width="17" height="240" fill="#D97706"/>
  <text class="font lane-label" x="57" y="690" text-anchor="middle" transform="rotate(-90 57 690)">TWO-TIER (DL + DW)</text>

  <g filter="url(#shadow)">
    <rect x="110" y="620" width="190" height="140" rx="14" fill="#FFFBEB" stroke="#F3D18F" stroke-width="2"/>
    <rect x="450" y="620" width="200" height="140" rx="14" fill="#FFFFFF" stroke="#F3D18F" stroke-width="2"/>
    <rect x="790" y="605" width="220" height="70" rx="12" fill="#FFFFFF" stroke="#F3D18F" stroke-width="2"/>
    <rect x="790" y="690" width="220" height="70" rx="12" fill="#FFFFFF" stroke="#F3D18F" stroke-width="2"/>
    <rect x="1060" y="605" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#F3D18F" stroke-width="2"/>
    <rect x="1060" y="690" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#F3D18F" stroke-width="2"/>
  </g>
  <g class="font">
    <text class="box-title" x="205" y="655" text-anchor="middle">STRUCTURED</text>
    <text class="item" x="205" y="674" text-anchor="middle">SEMI-STRUCTURED</text>
    <text class="item" x="205" y="692" text-anchor="middle">UNSTRUCTURED DATA</text>

    <text class="box-title" x="550" y="670" text-anchor="middle">DATA LAKE</text>
    <text class="item" x="550" y="695" text-anchor="middle">único ponto de entrada,</text>
    <text class="item" x="550" y="712" text-anchor="middle">todos os formatos</text>

    <text class="item" x="900" y="632" text-anchor="middle" font-weight="700" fill="#17324D">DATA WAREHOUSES</text>
    <text class="item" x="900" y="649" text-anchor="middle">visão consolidada</text>

    <text class="item" x="900" y="717" text-anchor="middle" font-weight="700" fill="#17324D">DATA SOURCE</text>
    <text class="item" x="900" y="734" text-anchor="middle">reuso como fonte</text>

    <text class="item" x="1150" y="632" text-anchor="middle" font-weight="700" fill="#17324D">BI, REPORTS</text>
    <text class="item" x="1150" y="649" text-anchor="middle">análise de negócio</text>

    <text class="item" x="1150" y="717" text-anchor="middle" font-weight="700" fill="#17324D">MACHINE</text>
    <text class="item" x="1150" y="734" text-anchor="middle">LEARNING</text>
  </g>
  <path class="flow" d="M 300 690 L 448 690"/>
  <text class="font step-label" x="374" y="677" text-anchor="middle">EXTRACT / LOAD</text>
  <path class="flow" d="M 650 655 L 788 640"/>
  <text class="font step-label" x="719" y="628" text-anchor="middle">ETL</text>
  <path class="flow" d="M 650 700 L 788 715"/>
  <path class="flow" d="M 1010 640 L 1058 640"/>
  <path class="flow" d="M 1010 725 L 1058 725"/>

  <!-- Lane 4: Data Warehouse Architecture (Data Lake com metadata layer) -->
  <rect x="40" y="820" width="1220" height="220" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="820" width="34" height="220" rx="16" fill="#B45309"/>
  <rect x="57" y="820" width="17" height="220" fill="#B45309"/>
  <text class="font lane-label" x="57" y="932" text-anchor="middle" transform="rotate(-90 57 932)">DATALAKEHOUSE</text>

  <g filter="url(#shadow)">
    <rect x="110" y="865" width="180" height="120" rx="14" fill="#FEF2F2" stroke="#F5B4AE" stroke-width="2"/>
  </g>
  <g class="font">
    <text class="box-title" x="200" y="900" text-anchor="middle">STRUCTURED</text>
    <text class="item" x="200" y="922" text-anchor="middle">SEMI-STRUCTURED</text>
    <text class="item" x="200" y="944" text-anchor="middle">UNSTRUCTURED DATA</text>
  </g>
  <path class="flow" d="M 290 925 L 338 925"/>
  <text class="font step-label" x="314" y="912" text-anchor="middle">ETL</text>

  <g filter="url(#shadow)">
    <rect x="340" y="850" width="420" height="150" rx="18" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
  <g class="font">
    <text class="box-title" x="550" y="878" text-anchor="middle">DATA LAKE</text>
    <text class="item" x="550" y="899" text-anchor="middle" font-weight="700" fill="#6D28D9">METADATA · CATALOGING · INDEXING LAYER</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="365" y="915" width="370" height="65" rx="12" fill="#FFFFFF" stroke="#AEBDFD" stroke-width="2"/>
  </g>
  <text class="font item" x="550" y="953" text-anchor="middle">dados brutos + camada de metadados sobre o mesmo repositório</text>

  <path class="flow" d="M 760 925 L 808 900"/>
  <path class="flow" d="M 760 925 L 808 950"/>

  <g filter="url(#shadow)">
    <rect x="810" y="865" width="200" height="55" rx="12" fill="#FFFFFF" stroke="#F3D18F" stroke-width="2"/>
    <rect x="810" y="935" width="200" height="55" rx="12" fill="#FFFFFF" stroke="#F3D18F" stroke-width="2"/>
  </g>
  <g class="font">
    <text class="item" x="910" y="897" text-anchor="middle" font-weight="700" fill="#17324D">BI REPORTS</text>
    <text class="item" x="910" y="967" text-anchor="middle" font-weight="700" fill="#17324D">DATA SOURCE</text>
  </g>

  <path class="flow" d="M 1010 892 L 1058 892"/>
  <path class="flow" d="M 1010 962 L 1058 962"/>

  <g filter="url(#shadow)">
    <rect x="1060" y="865" width="180" height="125" rx="14" fill="#FFFFFF" stroke="#F5B4AE" stroke-width="2"/>
  </g>
  <g class="font">
    <text class="box-title" x="1150" y="905" text-anchor="middle">MACHINE</text>
    <text class="box-title" x="1150" y="925" text-anchor="middle">LEARNING</text>
  </g>

  <!-- Rodapé -->
  <text class="font" x="650" y="1063" text-anchor="middle" font-size="12.5" font-weight="500" fill="#64748B">a evolução vai do armazenamento isolado (raias 1 e 2) para arquiteturas combinadas, onde o Data Lake alimenta o Data Warehouse e o consumo direto (raias 3 e 4)</text>
</svg>
