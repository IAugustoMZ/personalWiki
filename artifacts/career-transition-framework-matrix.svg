<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Matriz de planejamento da transição de carreira</title>
  <desc id="description">Matriz três por três com nove dimensões do planejamento. A posição central, transição de carreira, está circulada em vermelho.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#17324D" flood-opacity="0.12"/>
    </filter>
    <filter id="soft-shadow" x="-25%" y="-30%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17324D" flood-opacity="0.12"/>
    </filter>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .label { font-size: 20px; font-weight: 750; letter-spacing: 0.35px; fill: #17324D; }
      .detail { font-size: 15px; font-weight: 550; fill: #64748B; }
    </style>
  </defs>

  <rect width="1200" height="900" rx="28" fill="#F8FAFC"/>
  <rect x="18" y="18" width="1164" height="864" rx="22" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <g class="font">
    <text x="54" y="64" font-size="25" font-weight="800" letter-spacing="2" fill="#17324D">FRAMEWORK</text>
    <text x="54" y="89" font-size="14" font-weight="500" fill="#64748B">planejamento da transição de carreira</text>

    <!-- Base da matriz 3 × 3 -->
    <rect x="75" y="125" width="1050" height="670" rx="24" fill="#EEF2F6" stroke="#D9E2EC" stroke-width="2"/>

    <!-- Cartões -->
    <g filter="url(#shadow)">
      <rect x="95" y="145" width="325" height="190" rx="18" fill="#FFFFFF" stroke="#F5B4AE" stroke-width="2"/>
      <rect x="438" y="145" width="324" height="190" rx="18" fill="#FFFFFF" stroke="#F3D18F" stroke-width="2"/>
      <rect x="780" y="145" width="325" height="190" rx="18" fill="#FFFFFF" stroke="#AEBDFD" stroke-width="2"/>

      <rect x="95" y="365" width="325" height="190" rx="18" fill="#FFFFFF" stroke="#AEBDFD" stroke-width="2"/>
      <rect x="438" y="365" width="324" height="190" rx="18" fill="#FFF7F7" stroke="#FCA5A5" stroke-width="2"/>
      <rect x="780" y="365" width="325" height="190" rx="18" fill="#FFFFFF" stroke="#E6B3D2" stroke-width="2"/>

      <rect x="95" y="585" width="325" height="190" rx="18" fill="#FFFFFF" stroke="#8DD5C8" stroke-width="2"/>
      <rect x="438" y="585" width="324" height="190" rx="18" fill="#FFFFFF" stroke="#B9A7E8" stroke-width="2"/>
      <rect x="780" y="585" width="325" height="190" rx="18" fill="#FFFFFF" stroke="#F3D18F" stroke-width="2"/>
    </g>

    <!-- Conteúdo da primeira linha -->
    <text class="label" x="258" y="248" text-anchor="middle">PROPÓSITO</text>

    <text class="label" x="600" y="233" text-anchor="middle">TRANSIÇÃO PARA</text>
    <text class="label" x="600" y="263" text-anchor="middle">BIG DATA &amp; AI</text>

    <text class="label" x="943" y="248" text-anchor="middle">NETWORKING</text>

    <!-- Conteúdo da segunda linha -->
    <text class="label" x="258" y="451" text-anchor="middle">CAPACITAÇÃO</text>
    <text class="detail" x="258" y="481" text-anchor="middle">conhecimento</text>

    <text class="label" x="600" y="451" text-anchor="middle" fill="#991B1B">TRANSIÇÃO</text>
    <text class="label" x="600" y="481" text-anchor="middle" fill="#991B1B">DE CARREIRA</text>

    <text class="label" x="943" y="451" text-anchor="middle">SUPORTE</text>
    <text class="label" x="943" y="481" text-anchor="middle">EMOCIONAL</text>

    <!-- Conteúdo da terceira linha -->
    <text class="label" x="258" y="688" text-anchor="middle">EXPERIÊNCIA</text>

    <text class="label" x="600" y="688" text-anchor="middle" font-size="18">IMPULSIONADORES</text>

    <text class="label" x="943" y="673" text-anchor="middle">PLANO</text>
    <text class="label" x="943" y="703" text-anchor="middle">FINANCEIRO</text>

    <!-- Destaque circular de P22 -->
    <ellipse cx="600" cy="460" rx="178" ry="124" fill="none" stroke="#DC2626" stroke-width="5"/>
    <ellipse cx="600" cy="460" rx="186" ry="132" fill="none" stroke="#DC2626" stroke-width="2" stroke-opacity="0.28"/>
  </g>
</svg>
