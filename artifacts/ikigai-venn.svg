<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de Venn do Ikigai</title>
  <desc id="description">Quatro círculos representam o que eu amo, o que o mundo precisa, pelo que posso ser pago e em que sou bom. As interseções formam missão, vocação, profissão, paixão e, ao centro, Ikigai.</desc>

  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#17324D" flood-opacity="0.14"/>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324D" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .guide { fill: none; stroke: #64748B; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
      .card-title { font-size: 18px; font-weight: 700; letter-spacing: 1.2px; fill: #17324D; }
      .card-subtitle { font-size: 13px; font-weight: 500; fill: #64748B; }
      .intersection { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; fill: #17324D; }
    </style>
  </defs>

  <rect width="1200" height="900" rx="28" fill="#F8FAFC"/>
  <rect x="18" y="18" width="1164" height="864" rx="22" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <g class="font">
    <text x="54" y="64" font-size="25" font-weight="800" letter-spacing="2" fill="#17324D">IKIGAI</text>
    <text x="54" y="89" font-size="14" font-weight="500" fill="#64748B">propósito em equilíbrio</text>

    <!-- Linhas-guia dos quatro pontos cardeais -->
    <path class="guide" d="M 600 106 L 600 157"/>
    <path class="guide" d="M 1036 450 L 1000 450"/>
    <path class="guide" d="M 600 794 L 600 745"/>
    <path class="guide" d="M 164 450 L 200 450"/>

    <!-- Quatro dimensões do Ikigai -->
    <g filter="url(#shadow)">
      <circle cx="600" cy="330" r="225" fill="#F97367" fill-opacity="0.26" stroke="#E4574B" stroke-width="3"/>
      <circle cx="750" cy="450" r="225" fill="#F2B84B" fill-opacity="0.26" stroke="#D99A21" stroke-width="3"/>
      <circle cx="600" cy="570" r="225" fill="#35B7A0" fill-opacity="0.26" stroke="#15917D" stroke-width="3"/>
      <circle cx="450" cy="450" r="225" fill="#5B7CFA" fill-opacity="0.24" stroke="#3E5FD5" stroke-width="3"/>
    </g>

    <!-- Cartões externos -->
    <g filter="url(#soft-shadow)">
      <rect x="485" y="46" width="230" height="52" rx="14" fill="#FFFFFF" stroke="#F5B4AE" stroke-width="2"/>
      <rect x="1036" y="410" width="130" height="80" rx="14" fill="#FFFFFF" stroke="#F3D18F" stroke-width="2"/>
      <rect x="474" y="794" width="252" height="68" rx="14" fill="#FFFFFF" stroke="#8DD5C8" stroke-width="2"/>
      <rect x="34" y="410" width="130" height="80" rx="14" fill="#FFFFFF" stroke="#AEBDFD" stroke-width="2"/>
    </g>

    <text class="card-title" x="600" y="79" text-anchor="middle">O QUE EU AMO</text>

    <text class="card-title" x="1101" y="436" text-anchor="middle">O QUE O</text>
    <text class="card-title" x="1101" y="459" text-anchor="middle">MUNDO</text>
    <text class="card-title" x="1101" y="482" text-anchor="middle">PRECISA</text>

    <text class="card-title" x="600" y="822" text-anchor="middle">PELO QUE POSSO</text>
    <text class="card-title" x="600" y="845" text-anchor="middle">SER PAGO</text>

    <text class="card-title" x="99" y="436" text-anchor="middle">EM QUE</text>
    <text class="card-title" x="99" y="459" text-anchor="middle">EU SOU</text>
    <text class="card-title" x="99" y="482" text-anchor="middle">BOM?</text>

    <!-- Interseções adjacentes -->
    <g filter="url(#soft-shadow)">
      <rect x="682" y="284" width="122" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.92" stroke="#E9A75D" stroke-width="2"/>
      <rect x="682" y="572" width="122" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.92" stroke="#A7B974" stroke-width="2"/>
      <rect x="376" y="572" width="142" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.92" stroke="#6AAEB3" stroke-width="2"/>
      <rect x="386" y="284" width="122" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.92" stroke="#9B8ED5" stroke-width="2"/>
    </g>
    <text class="intersection" x="743" y="312" text-anchor="middle">MISSÃO</text>
    <text class="intersection" x="743" y="600" text-anchor="middle">VOCAÇÃO</text>
    <text class="intersection" x="447" y="600" text-anchor="middle">PROFISSÃO</text>
    <text class="intersection" x="447" y="312" text-anchor="middle">PAIXÃO</text>

    <!-- Interseção das quatro dimensões -->
    <g filter="url(#soft-shadow)">
      <circle cx="600" cy="450" r="64" fill="#17324D" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="600" cy="450" r="55" fill="none" stroke="#6ED4C1" stroke-width="2" stroke-opacity="0.9"/>
    </g>
    <text x="600" y="445" text-anchor="middle" font-size="21" font-weight="800" letter-spacing="1.2" fill="#FFFFFF">IKIGAI</text>
    <text x="600" y="469" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.8" fill="#C8F1E9">PROPÓSITO</text>
  </g>
</svg>
