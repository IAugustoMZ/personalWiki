# Personal Wiki: a Markdown knowledge base. Poetry manages the tooling that publishes it as a site.
# Install the docs group with `poetry install --with docs`, then `poetry run mkdocs serve`.

[project]
name = "personal-wiki"
version = "0.1.0"
description = "Personal knowledge wiki: study notes, review questions and diagrams, published as a MkDocs site."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.poetry]
package-mode = false

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.7"
mkdocs-same-dir = "^0.1.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
